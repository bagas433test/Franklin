name: Jalankan Franklin Agent
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Kita coba ganti nama variabelnya ke format yang mungkin dikenali Franklin
      FRANKLIN_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      RPC_URL: 'https://mainnet.base.org'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm install -g @blockrun/franklin
      
      - name: Jalankan Cek Saldo
        run: |
          # Jangan gunakan 'franklin config set' lagi
          echo "Menjalankan pengecekan saldo..."
          franklin balance
