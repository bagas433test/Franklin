name: Jalankan Franklin Agent
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Jalan tiap jam

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @blockrun/franklin
      # Ubah bagian bawah ini:
      - run: franklin "Cek saldo saya dan laporkan hasilnya"
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: 'https://mainnet.base.org'
