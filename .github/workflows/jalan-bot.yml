name: Jalankan Franklin Agent
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @blockrun/franklin
      
      # BARIS DEBUG INI PENTING:
      - run: |
          echo "Memulai pengecekan kunci..."
          if [ -z "$PRIVATE_KEY" ]; then 
            echo "STATUS: KUNCI TIDAK TERDETEKSI (Variabel kosong)"
          else 
            echo "STATUS: KUNCI TERDETEKSI (Panjang karakter: ${#PRIVATE_KEY})"
          fi
          franklin balance
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: 'https://mainnet.base.org'
